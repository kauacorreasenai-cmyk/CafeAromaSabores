# ===========================
# CONFIGURAÇÃO GERAL
# ===========================
spring.application.name=CafeAromaSabores

# ===========================
# DATASOURCE - MySQL Configuration
# ===========================
# O "createDatabaseIfNotExist=true" garante que o banco seja criado se não existir
spring.datasource.url=jdbc:mysql://localhost:3306/cafearomasabor?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=Senai@403
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===========================
# JPA / HIBERNATE CONFIGURATION
# ===========================
# A MÁGICA: 'update' faz o Spring criar/atualizar as tabelas baseado nas suas classes @Entity
spring.jpa.hibernate.ddl-auto=update

# Dialeto para o MySQL falar a língua correta com o Java
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Mostrar e formatar o SQL no console (ajuda a ver as tabelas sendo criadas)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===========================
# THYMELEAF CONFIGURATION
# ===========================
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML

# ===========================
# SERVER CONFIGURATION
# ===========================
server.port=8080
# Comentado para evitar confusão, use se quiser um prefixo na URL
# server.servlet.context-path=/app