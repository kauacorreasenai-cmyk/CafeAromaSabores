    <!DOCTYPE html>
    <html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Login - CafeAromaESabor</title>
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                background: linear-gradient(135deg, #3E2723 0%, #5D4037 50%, #A1887F 100%);
                min-height: 100vh;
                display: flex;
                justify-content: center;
                align-items: center;
            }

            .login-container {
                background: #FFFFFF;
                padding: 50px;
                border-radius: 15px;
                box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
                width: 100%;
                max-width: 420px;
            }

            .login-container h1 {
                color: #3E2723;
                margin-bottom: 30px;
                text-align: center;
                font-size: 32px;
                font-weight: bold;
            }

            .form-group {
                margin-bottom: 20px;
            }

            .form-group label {
                display: block;
                margin-bottom: 8px;
                color: #3E2723;
                font-weight: 600;
                font-size: 14px;
            }

            .form-group input {
                width: 100%;
                padding: 12px 15px;
                border: 2px solid #A1887F;
                border-radius: 8px;
                font-size: 14px;
                transition: all 0.3s;
                background-color: #F5F1F0;
            }

            .form-group input:focus {
                outline: none;
                border-color: #3E2723;
                background-color: #FFFFFF;
                box-shadow: 0 0 8px rgba(62, 39, 35, 0.2);
            }

            .btn-submit {
                width: 100%;
                padding: 13px;
                background: linear-gradient(135deg, #3E2723 0%, #5D4037 100%);
                color: #FFFFFF;
                border: none;
                border-radius: 8px;
                font-size: 16px;
                font-weight: bold;
                cursor: pointer;
                transition: all 0.3s;
                margin-top: 15px;
                box-shadow: 0 4px 15px rgba(62, 39, 35, 0.2);
            }

            .btn-submit:hover {
                transform: translateY(-2px);
                box-shadow: 0 6px 20px rgba(62, 39, 35, 0.3);
            }

            .error-message {
                background-color: #ffebee;
                color: #c62828;
                padding: 12px;
                border-radius: 8px;
                margin-bottom: 20px;
                border-left: 4px solid #c62828;
            }
        </style>
    </head>
    <body>
        <div class="login-container">
            <h1>☕ CafeAromaESabor</h1>

            <!-- Mensagem de erro (se houver) -->
            <div th:if="${erro}" class="error-message">
                <p th:text="${erro}"></p>
            </div>

            <form method="POST" action="/login">
                <div class="form-group">
                    <label for="login">Usuário:</label>
                    <input type="text" id="login" name="login" required placeholder="Digite seu usuário">
                </div>

                <div class="form-group">
                    <label for="senha">Senha:</label>
                    <input type="password" id="senha" name="senha" required placeholder="Digite sua senha">
                </div>

                <button type="submit" class="btn-submit">Entrar</button>
            </form>
        </div>
    </body>
    </html>
